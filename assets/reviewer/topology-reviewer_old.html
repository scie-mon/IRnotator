<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Topology Reviewer Prototype</title>
  <style>
    :root {
      --bg: #f7f6f2;
      --surface: #fbfbf9;
      --border: #d8d4cc;
      --text: #28251d;
      --muted: #6d6a64;
      --primary: #01696f;
      --accept: #437a22;
      --reject: #a13544;
      --shadow: 0 12px 30px rgba(0,0,0,0.08);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 1.3fr 1fr 1.2fr;
      gap: 16px;
      align-items: center;
      padding: 14px 20px;
      background: rgba(251,251,249,0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; flex-direction: column; gap: 4px; }
    .brand h1 { margin: 0; font-size: 1.15rem; }
    .brand p { margin: 0; color: var(--muted); font-size: 0.92rem; }
    .meta {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .chip {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      font-size: 0.92rem;
    }
    .status-chip[data-status="accept"] { color: white; background: var(--accept); border-color: var(--accept); }
    .status-chip[data-status="reject"] { color: white; background: var(--reject); border-color: var(--reject); }
    .status-chip[data-status="undecided"] { color: #3d2f00; background: #f1df9b; border-color: #d7ba49; }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    button.primary { background: var(--primary); color: white; border-color: var(--primary); }
    .viewer { padding: 20px; display: grid; place-items: center; }
    .figure-wrap {
      width: min(96vw, 1400px);
      height: calc(100vh - 220px);
      min-height: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .figure-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }
    .empty {
      max-width: 60ch;
      text-align: center;
      color: var(--muted);
      padding: 24px;
      line-height: 1.6;
    }
    .help {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 12px 20px 18px;
      font-size: 0.93rem;
      color: var(--muted);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    kbd {
      font-family: inherit;
      border: 1px solid var(--border);
      background: white;
      padding: 2px 8px;
      border-radius: 8px;
      color: var(--text);
    }
    @media (max-width: 900px) {
      .topbar { grid-template-columns: 1fr; }
      .brand, .meta, .actions { justify-content: start; }
      .figure-wrap { height: calc(100vh - 300px); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Topology Reviewer</h1>
      <p>Review one plot at a time and export sequence calls as TSV.</p>
    </div>
    <div class="meta">
      <div class="chip" id="seqId">No file loaded</div>
      <div class="chip" id="progress">0 / 0</div>
      <div class="chip status-chip" id="statusChip" data-status="undecided">undecided</div>
    </div>
    <div class="actions">
      <button id="prevBtn">Previous</button>
      <button id="nextBtn">Next</button>
      <button id="nextUndecidedBtn">Next undecided</button>
      <button class="primary" id="exportBtn">Export TSV</button>
    </div>
  </header>

  <main class="viewer">
    <section class="figure-wrap" id="figureWrap">
      <div class="empty" id="emptyState">
        <p><strong>Prototype ready.</strong> Serve this directory and open via localhost.</p>
      </div>
      <img id="plotImage" alt="Current topology plot" hidden />
    </section>
  </main>

  <footer class="help">
    <span><kbd>←</kbd>/<kbd>→</kbd> navigate</span>
    <span><kbd>↑</kbd> accept</span>
    <span><kbd>↓</kbd> reject</span>
    <span><kbd>u</kbd> undecided</span>
    <span><kbd>j</kbd> next undecided</span>
    <span><kbd>e</kbd> export</span>
  </footer>

  <script>
    const state = {
      items: [],
      index: 0,
      decisions: new Map(),
      autoAdvance: true
    };

    const decisionKeymap = {
      ArrowUp: "accept",
      ArrowDown: "reject"
    };

    const seqIdEl = document.getElementById("seqId");
    const progressEl = document.getElementById("progress");
    const statusChipEl = document.getElementById("statusChip");
    const imgEl = document.getElementById("plotImage");
    const emptyEl = document.getElementById("emptyState");

    function internalId(item) {
      return String(item?.seq_id || "").trim();
    }

    function displayId(item) {
      return String(
        item?.source_id ||
        item?.source_header ||
        item?.seq_id ||
        ""
      ).trim();
    }

    function itemKey(item) {
      return internalId(item) || null;
    }

    function getDecision(item) {
      const key = itemKey(item);
      return key ? (state.decisions.get(key) || "undecided") : "undecided";
    }

    function normalizeSeed(seed) {
      const value = String(seed || "undecided").toLowerCase();

      if (value === "accept" || value === "pass") {
        return "accept";
      }
      if (value === "reject" || value === "fail") {
        return "reject";
      }
      return "undecided";
    }

    function validateManifest(items) {
      const seenInternalIds = new Set();

      items.forEach((item, index) => {
        const seqId = internalId(item);

        if (!seqId) {
          throw new Error(`Manifest item ${index + 1} has no seq_id.`);
        }
        if (!item.image) {
          throw new Error(`Manifest item ${index + 1} has no image path.`);
        }
        if (seenInternalIds.has(seqId)) {
          throw new Error(`Duplicate manifest seq_id: ${seqId}`);
        }

        seenInternalIds.add(seqId);
      });
    }

    async function loadManifest() {
      try {
        const response = await fetch("review-manifest.json");

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        state.items = Array.isArray(data.items) ? data.items : [];

        validateManifest(state.items);

        state.index = 0;
        state.decisions = new Map();

        state.items.forEach((item) => {
          state.decisions.set(
            itemKey(item),
            normalizeSeed(item.seed)
          );
        });

        render();
      } catch (error) {
        console.error(error);

        state.items = [];
        state.decisions = new Map();

        emptyEl.innerHTML =
          "<p><strong>Could not load review-manifest.json.</strong> " +
          "Serve this directory locally and verify the manifest schema.</p>";

        render();
      }
    }

    function currentItem() {
      return state.items[state.index] || null;
    }

    function setDecision(decision) {
      const item = currentItem();
      const key = itemKey(item);

      if (!key) {
        return;
      }

      state.decisions.set(key, decision);

      if (state.autoAdvance && state.index < state.items.length - 1) {
        state.index += 1;
      }

      render();
    }

    function next(step) {
      if (!state.items.length) {
        return;
      }

      state.index = Math.max(
        0,
        Math.min(state.items.length - 1, state.index + step)
      );

      render();
    }

    function nextUndecided() {
      if (!state.items.length) {
        return;
      }

      for (let offset = 1; offset <= state.items.length; offset += 1) {
        const index = (state.index + offset) % state.items.length;

        if (getDecision(state.items[index]) === "undecided") {
          state.index = index;
          render();
          return;
        }
      }
    }

    function renderMeta() {
      const item = currentItem();
      const status = item ? getDecision(item) : "undecided";

      if (item) {
        seqIdEl.textContent = displayId(item) || internalId(item);
        seqIdEl.title =
          item.source_header ||
          item.source_id ||
          internalId(item);
      } else {
        seqIdEl.textContent = "No file loaded";
        seqIdEl.title = "";
      }

      progressEl.textContent = state.items.length
        ? `${state.index + 1} / ${state.items.length}`
        : "0 / 0";

      statusChipEl.textContent = status;
      statusChipEl.dataset.status = status;
    }

    function render() {
      renderMeta();

      const item = currentItem();

      if (!item) {
        imgEl.hidden = true;
        emptyEl.hidden = false;
        return;
      }

      imgEl.src = item.image;
      imgEl.alt = `Topology plot: ${displayId(item) || internalId(item)}`;
      imgEl.hidden = false;
      emptyEl.hidden = true;
    }

    function tsvField(value) {
      return String(value ?? "")
        .replace(/\t/g, " ")
        .replace(/\r?\n/g, " ");
    }

    function exportTSV() {
      const lines = ["seq_id\tdecision\timage"];

      state.items.forEach((item) => {
        const seqId = internalId(item);

        lines.push(
          [
            tsvField(seqId),
            tsvField(getDecision(item)),
            tsvField(item.image)
          ].join("\t")
        );
      });

      const blob = new Blob(
        [lines.join("\n") + "\n"],
        { type: "text/tab-separated-values;charset=utf-8" }
      );

      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");

      anchor.href = url;
      anchor.download = "review.tsv";
      anchor.click();

      URL.revokeObjectURL(url);
    }

    document.getElementById("prevBtn").addEventListener("click", () => next(-1));
    document.getElementById("nextBtn").addEventListener("click", () => next(1));
    document
      .getElementById("nextUndecidedBtn")
      .addEventListener("click", nextUndecided);
    document.getElementById("exportBtn").addEventListener("click", exportTSV);

    document.addEventListener("keydown", (event) => {
      const tag = document.activeElement?.tagName;

      if (tag === "INPUT" || tag === "TEXTAREA") {
        return;
      }

      if (event.key === "ArrowLeft") {
        event.preventDefault();
        next(-1);
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        next(1);
      } else if (decisionKeymap[event.key]) {
        event.preventDefault();
        setDecision(decisionKeymap[event.key]);
      } else if (event.key.toLowerCase() === "u") {
        event.preventDefault();
        setDecision("undecided");
      } else if (event.key.toLowerCase() === "j") {
        event.preventDefault();
        nextUndecided();
      } else if (event.key.toLowerCase() === "e") {
        event.preventDefault();
        exportTSV();
      }
    });

    loadManifest();
  </script>
</body>
</html>
